<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inline & Block</title>

	<style>
		body{
			font-family: sans-serif;
			font-size: 20px;
			line-height: 150%;
			margin: 5rem;
		}
		div{
			border: 1px solid lightgreen;
			padding: 1rem;
		}
		span{
			border-bottom: 1px solid rgb(48, 132, 180);
		}
	</style>

</head>
<body>

	<div>
		Lorem ipsum dolor sit,
		<span>
		amet consectetur adipisicing elit. Beatae sed laborum necessitatibus minus fuga quasi a,
		tempore eligendi sunt possimus, delectus perferendis nobis,
		</span>
		itaque voluptate facere id explicabo perspiciatis veritatis?
	</div>
	
</body>
</html>
