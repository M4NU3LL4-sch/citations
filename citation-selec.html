<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

	<style>
		body{ font-family: sans-serif;
			font-family: "Roboto Slab", serif; }
		div { color: rgba(15, 59, 8, 0.531);}
		

		.quote { font-size: 4rem; }
		.source {font-style: italic;}
		.important { background: rgb(169, 240, 217);}
		

		.citation { 
			margin: 7rem;
			padding: 2rem;
			border-radius: 5rem;
			aspect-ratio: 8/4;
		}

		#bonjour { background: rgb(100, 164, 196);}
		#bonjour { border: 3px solid rgb(14, 51, 65);}
		#machin { background: orange;}
		#machin { border: solid rgb(137, 9, 9);}
	</style>

</head>
<body>

	<div class="citation" id="bonjour">
		<div class="quote"> Bonjour, monde.</div>
		<div class="source important">- Anne Onyme</div>
	</div>

<div class="citation" id="machin">
	<div class="quote">Hello.</div>
	<div class="source">-Steve</div>
</div>

</body>
</html>
